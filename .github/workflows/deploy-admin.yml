name: Deploy admin to Cloudflare Workers

# Every push to main deploys and may release a version (ADR 0004), except
# the checker's and the admin CMS's data commits.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'state.json'
      - 'shows.json'

# Deploys run one at a time, in order, and are never cancelled partway, so a
# released version is always the one live.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # To create the release and push the version bump (ADR 0004).
      contents: write
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: admin/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve deploy target
        id: target
        env:
          ADMIN_LIVE_URL: ${{ secrets.ADMIN_LIVE_URL }}
        run: |
          case "${GITHUB_REF#refs/heads/}" in
            main) DEPLOY_URL="${ADMIN_LIVE_URL:-https://anime-ep-checker.dev}" ;;
            *) DEPLOY_URL="" ;;
          esac
          DEPLOY_URL="${DEPLOY_URL%/}"
          SITE_NAME="${DEPLOY_URL#https://}"
          echo "site_name=${SITE_NAME:-anime-ep-checker admin}" >> "$GITHUB_OUTPUT"
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      # The version this push releases: the last v* tag, bumped as the push's
      # conventional commits ask (scripts/next-version.ts). Tags are the
      # counter; admin/package.json mirrors them. Nothing to release (chore,
      # docs…) keeps the current version. A re-run keeps its commit's tag.
      - name: Version
        id: version
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          TAGS=$(git ls-remote --tags origin 'v*')
          HERE=$(awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/v", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' <<< "$TAGS" | head -1)
          LAST=$(sed -nE 's#.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' <<< "$TAGS" | sort -V | tail -1)
          LAST=${LAST:-0.0.0}
          if [ -n "$HERE" ]; then
            VERSION="$HERE"; NEW=""
          else
            MESSAGES=$(jq -c 'if type == "array" and length > 0 then map(.message) else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
            [ -n "$MESSAGES" ] || MESSAGES=$(git log -1 --format=%B | jq -Rs '[.]')
            NEW=$(node scripts/next-version.ts "$LAST" <<< "$MESSAGES")
            VERSION="${NEW:-$LAST}"
          fi
          sed -i -E 's/^(  "version": )"[^"]*"/\1"'"$VERSION"'"/' package.json
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          # The new Release's notes: the build bakes them into the Releases
          # page before GitHub has the Release, and the Release step uses them.
          if [ -n "$NEW" ]; then
            NOTES=$(jq -r 'if type == "array" and length > 0 then map("- " + (.message | split("\n")[0])) | join("\n") else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
            [ -n "$NOTES" ] || NOTES="- $(git log -1 --format=%s)"
            { echo "notes<<RELEASE_NOTES_END"; echo "$NOTES"; echo "RELEASE_NOTES_END"; } >> "$GITHUB_OUTPUT"
            echo "Releases v${NEW} (after v${LAST})." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No new version: stays v${VERSION}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The build reads the Release notes from GitHub (scripts/release-notes.ts).
      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.new }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: pnpm exec vinext-cloudflare deploy

      # Only once the deploy is live, so a version always means "this ran".
      # The tag goes on the deployed commit; the package.json bump goes on top
      # of main as it is now (the checker may have pushed meanwhile). Pushes
      # with the built-in token don't start another deploy.
      - name: Release
        id: release
        if: steps.version.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes "$NOTES"

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git checkout -f -B release FETCH_HEAD
            sed -i -E 's/^(  "version": )"[^"]*"/\1"'"$VERSION"'"/' package.json
            git diff --quiet && exit 0 # already bumped
            git commit -am "chore: release ${VERSION}"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::Couldn't push the package.json bump; the next release sets it."

      - name: Notify Discord
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERSION: ${{ steps.version.outputs.version }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
          DEPLOY_URL: ${{ steps.target.outputs.deploy_url }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          FINAL_URL="$DEPLOY_URL"

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${REPO_URL}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # The version now live: new in this deploy, or unchanged.
          if [ -n "$NEW_VERSION" ]; then
            VERSION_TEXT="[v${NEW_VERSION}](${REPO_URL}/releases/tag/v${NEW_VERSION})"
            TITLE_VERSION=" v${NEW_VERSION}"
          elif [ -n "$VERSION" ]; then
            VERSION_TEXT="v${VERSION} (no new version)"
            TITLE_VERSION=""
          else
            VERSION_TEXT=""
            TITLE_VERSION=""
          fi

          case "$DEPLOY_OUTCOME" in
            success) TITLE="🚀 ${SITE_NAME}${TITLE_VERSION} deployed successfully"; COLOR=5763719; TITLE_URL="$FINAL_URL" ;;
            failure) TITLE="❌ ${SITE_NAME} deployment failed"; COLOR=15548997; TITLE_URL="$RUN_URL" ;;
            *) TITLE="⚠️ ${SITE_NAME} deployment ${DEPLOY_OUTCOME}"; COLOR=16705372; TITLE_URL="$RUN_URL" ;;
          esac

          COMMITS=$(jq -r '
            if type == "array" and length > 0 then
              length as $n
              | (.[-10:] | reverse
                 | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | .[0:72]) — \(.author.username // .author.name)")
                 | join("\n"))
                + (if $n > 10 then "\n…and \($n - 10) more" else "" end)
            else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="[\`${SHORT_SHA}\`](${COMMIT_URL}) $(git log -1 --pretty=%s | cut -c1-72)"
          fi

          DURATION=""
          STARTED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -n "$STARTED_AT" ]; then
            ELAPSED=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
            DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --arg title_url "$TITLE_URL" --argjson color "$COLOR" \
            --arg commits "$COMMITS" --arg branch "$BRANCH" --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" --arg actor "$GITHUB_ACTOR" --arg duration "$DURATION" \
            --arg run_number "$GITHUB_RUN_NUMBER" --arg timestamp "$TIMESTAMP" \
            --arg outcome "$DEPLOY_OUTCOME" --arg site_url "$FINAL_URL" --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" --arg version "$VERSION_TEXT" \
            '{
              embeds: [{
                title: $title, url: $title_url, color: $color, description: $commits,
                fields: (
                  [
                    {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                    {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                    {name: "Triggered by", value: $actor, inline: true}
                  ]
                  + (if $version != "" then [{name: "Version", value: $version, inline: true}] else [] end)
                  + (if $duration != "" then [{name: "Duration", value: $duration, inline: true}] else [] end)
                ),
                footer: {text: ("Run #" + $run_number)},
                timestamp: $timestamp
              }],
              components: [{
                type: 1,
                components: (
                  (if $outcome == "success" and $site_url != "" then [{type: 2, style: 5, label: "🌐 Visit site", url: $site_url}] else [] end)
                  + [{type: 2, style: 5, label: "📋 Workflow run", url: $run_url}]
                  + (if $compare_url != "" then [{type: 2, style: 5, label: "🔍 View changes", url: $compare_url}] else [] end)
                )
              }]
            }')

          curl -fsS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
