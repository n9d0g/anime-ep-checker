name: Deploy admin to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'shared/**'

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve deploy target
        id: target
        env:
          ADMIN_LIVE_URL: ${{ secrets.ADMIN_LIVE_URL }}
        run: |
          case "${GITHUB_REF#refs/heads/}" in
            main) DEPLOY_URL="${ADMIN_LIVE_URL:-https://anime-ep-checker.dev}" ;;
            *) DEPLOY_URL="" ;;
          esac
          DEPLOY_URL="${DEPLOY_URL%/}"
          SITE_NAME="${DEPLOY_URL#https://}"
          echo "site_name=${SITE_NAME:-anime-ep-checker admin}" >> "$GITHUB_OUTPUT"
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec vinext-cloudflare deploy

      - name: Notify Discord
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
          DEPLOY_URL: ${{ steps.target.outputs.deploy_url }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          FINAL_URL="$DEPLOY_URL"

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${REPO_URL}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          case "$DEPLOY_OUTCOME" in
            success) TITLE="🚀 ${SITE_NAME} deployed successfully"; COLOR=5763719; TITLE_URL="$FINAL_URL" ;;
            failure) TITLE="❌ ${SITE_NAME} deployment failed"; COLOR=15548997; TITLE_URL="$RUN_URL" ;;
            *) TITLE="⚠️ ${SITE_NAME} deployment ${DEPLOY_OUTCOME}"; COLOR=16705372; TITLE_URL="$RUN_URL" ;;
          esac

          COMMITS=$(jq -r '
            if type == "array" and length > 0 then
              length as $n
              | (.[-10:] | reverse
                 | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | .[0:72]) — \(.author.username // .author.name)")
                 | join("\n"))
                + (if $n > 10 then "\n…and \($n - 10) more" else "" end)
            else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="[\`${SHORT_SHA}\`](${COMMIT_URL}) $(git log -1 --pretty=%s | cut -c1-72)"
          fi

          DURATION=""
          STARTED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -n "$STARTED_AT" ]; then
            ELAPSED=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
            DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --arg title_url "$TITLE_URL" --argjson color "$COLOR" \
            --arg commits "$COMMITS" --arg branch "$BRANCH" --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" --arg actor "$GITHUB_ACTOR" --arg duration "$DURATION" \
            --arg run_number "$GITHUB_RUN_NUMBER" --arg timestamp "$TIMESTAMP" \
            --arg outcome "$DEPLOY_OUTCOME" --arg site_url "$FINAL_URL" --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" \
            '{
              embeds: [{
                title: $title, url: $title_url, color: $color, description: $commits,
                fields: (
                  [
                    {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                    {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                    {name: "Triggered by", value: $actor, inline: true}
                  ]
                  + (if $duration != "" then [{name: "Duration", value: $duration, inline: true}] else [] end)
                ),
                footer: {text: ("Run #" + $run_number)},
                timestamp: $timestamp
              }],
              components: [{
                type: 1,
                components: (
                  (if $outcome == "success" and $site_url != "" then [{type: 2, style: 5, label: "🌐 Visit site", url: $site_url}] else [] end)
                  + [{type: 2, style: 5, label: "📋 Workflow run", url: $run_url}]
                  + (if $compare_url != "" then [{type: 2, style: 5, label: "🔍 View changes", url: $compare_url}] else [] end)
                )
              }]
            }')

          curl -fsS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
