name: Notify Discord on Vercel deploy

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.failed

jobs:
  notify:
    if: github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Post deploy notification to Discord
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_URL: ${{ github.event.client_payload.url }}
          PROJECT_NAME: ${{ github.event.client_payload.project.name }}
          EVENT_ACTION: ${{ github.event.action }}
          BRANCH: ${{ github.event.client_payload.git.ref }}
          SHORT_SHA: ${{ github.event.client_payload.git.shortSha }}
          FULL_SHA: ${{ github.event.client_payload.git.sha }}
          DEPLOY_STATE: ${{ github.event.client_payload.state.type }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL is not set; skipping."
            exit 0
          fi

          if [ -z "$DEPLOY_URL" ]; then
            echo "Deployment URL missing from Vercel payload; skipping."
            exit 0
          fi

          export COMMIT_MSG="$(git log -1 --pretty=%s)"

          payload_json=$(python3 -c '
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          deploy_url = os.environ["DEPLOY_URL"]
          project = os.environ.get("PROJECT_NAME") or "anime-ep-checker"
          host = f"{project}.vercel.app"
          branch = os.environ.get("BRANCH") or "unknown"
          short_sha = os.environ.get("SHORT_SHA") or (os.environ.get("FULL_SHA") or "")[:7] or "unknown"
          details = os.environ.get("COMMIT_MSG", "Unknown commit")
          event_action = os.environ.get("EVENT_ACTION", "")
          deploy_state = (os.environ.get("DEPLOY_STATE") or "ERROR").upper()

          now = datetime.now(ZoneInfo("America/New_York"))
          time_str = now.strftime("%Y-%m-%d %H:%M:%S %Z")

          code_block = (
              f"Branch: {branch}\n"
              f"Commit: {short_sha}\n"
              f"Details: {details}\n"
              f"Time: {time_str}"
          )

          if event_action == "vercel.deployment.success":
              # Production main deploys link to the stable domain, not the unique deploy URL.
              live_url = f"https://{host}" if branch == "main" else deploy_url
              header = f"🚀 **{host}** deployed successfully!"
              footer = f"🔗 **Live URL:** {live_url}"
          else:
              code_block += f"\nError: Deployment failed with status: {deploy_state}"
              header = f"❌ **{host}** deployment failed!"
              footer = f"🔗 **Check logs:** {deploy_url}"

          content = f"{header}\n\n```\n{code_block}\n```\n\n{footer}"

          if len(content) > 2000:
              overflow = len(content) - 2000
              max_details = max(0, len(details) - overflow - 3)
              details = details[:max_details] + "..."
              code_block = (
                  f"Branch: {branch}\n"
                  f"Commit: {short_sha}\n"
                  f"Details: {details}\n"
                  f"Time: {time_str}"
              )
              if event_action != "vercel.deployment.success":
                  code_block += f"\nError: Deployment failed with status: {deploy_state}"
              content = f"{header}\n\n```\n{code_block}\n```\n\n{footer}"

          print(json.dumps({"content": content}))
          ')

          curl -fsS -X POST "$DISCORD_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: anime-ep-checker-deploy/1.0" \
            -d "$payload_json"
