name: Check anime episodes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run a full check even if no show is in its drop window
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-episodes
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_check: ${{ steps.gate.outputs.should_check }}
    steps:
      - name: Decide if full check is needed
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gate-tmp
          REF="${GITHUB_REF_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          CURL_OPTS=(--fail-with-body --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 3 -sSL)

          fetch() {
            local path="$1"
            local dest="$2"
            if ! curl "${CURL_OPTS[@]}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "${API}/${path}?ref=${REF}" \
              -o "$dest"; then
              echo "Failed to fetch ${path} (ref=${REF})" >&2
              cat "$dest" >&2
              exit 1
            fi
          }

          fetch "shows.json" gate-tmp/shows.json
          fetch "state.json" gate-tmp/state.json
          fetch "src/should-run.mjs" gate-tmp/should-run.mjs

          SHOWS_PATH=gate-tmp/shows.json \
          STATE_PATH=gate-tmp/state.json \
          node gate-tmp/should-run.mjs

  check:
    needs: gate
    if: needs.gate.outputs.should_check == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.11.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for new episodes
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WATCHING_CHANNEL_ID: ${{ secrets.DISCORD_WATCHING_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          MAL_REFRESH_TOKEN: ${{ secrets.MAL_REFRESH_TOKEN }}
          NETFLIX_COOKIE: ${{ secrets.NETFLIX_COOKIE }}
          DISNEY_REFRESH_TOKEN: ${{ secrets.DISNEY_REFRESH_TOKEN }}
          DISNEY_REGION: ${{ secrets.DISNEY_REGION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: pnpm check ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Update Disney refresh token secret
        # Runs even when the check step fails: Disney has already invalidated the
        # old token by that point, so losing the rotated one would lock us out.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ ! -f disney_refresh_token.txt ]; then
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "Disney+ refresh token rotated but GH_SECRETS_TOKEN is not set."
            echo "Add a fine-grained PAT with Secrets read/write and re-run, or update DISNEY_REFRESH_TOKEN manually."
            rm -f disney_refresh_token.txt
            exit 0
          fi

          gh secret set DISNEY_REFRESH_TOKEN < disney_refresh_token.txt
          rm -f disney_refresh_token.txt
          echo "Updated DISNEY_REFRESH_TOKEN secret."

      - name: Commit state updates
        run: |
          if git diff --quiet state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f state_commit_message.txt ]; then
            subject=$(head -n 1 state_commit_message.txt)
            body=$(tail -n +3 state_commit_message.txt 2>/dev/null | sed '/^$/d' || true)
            rm -f state_commit_message.txt
          else
            subject="chore: 🧹 update checker state"
            body=""
          fi

          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$BRANCH"
            git reset --soft "origin/$BRANCH"
            git add state.json

            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi

            if [ -n "$body" ]; then
              git commit -m "$subject" -m "$body"
            else
              git commit -m "$subject"
            fi

            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done

          exit 1
