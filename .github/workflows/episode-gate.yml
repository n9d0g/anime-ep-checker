name: Episode gate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: episode-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Decide if full check is needed
        id: gate
        run: |
          mkdir -p gate-tmp
          REF="${GITHUB_REF_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          CURL_OPTS=(--fail-with-body --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 3 -fsSL)

          fetch() {
            local path="$1"
            local dest="$2"
            if ! curl "${CURL_OPTS[@]}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "${API}/${path}?ref=${REF}" \
              -o "$dest"; then
              echo "Failed to fetch ${path} (ref=${REF})"
              exit 1
            fi
          }

          fetch "shows.json" gate-tmp/shows.json
          fetch "state.json" gate-tmp/state.json
          fetch "src/should-run.mjs" gate-tmp/should-run.mjs

          SHOWS_PATH=gate-tmp/shows.json \
          STATE_PATH=gate-tmp/state.json \
          node gate-tmp/should-run.mjs

      - name: Dispatch full check
        if: steps.gate.outputs.should_check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-episodes.yml --ref "${GITHUB_REF_NAME}"
